<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#5d5868"/>
    </marker>
  </defs>
  <rect width="1200" height="400" rx="20" fill="#15131a"/>

  <!-- the rein: the human line every stage hangs from -->
  <text x="36" y="52" fill="#f0953a" font-size="13" font-weight="700" letter-spacing="2">YOU HOLD THE REINS</text>
  <line x1="36" y1="96" x2="1164" y2="96" stroke="#f0953a" stroke-width="3" stroke-linecap="round"/>
  <g font-size="14" fill="#f3f1f6" text-anchor="middle">
    <line x1="297" y1="96" x2="297" y2="246" stroke="#f0953a" stroke-width="1.5" stroke-dasharray="4 5"/>
    <circle cx="297" cy="96" r="8" fill="#15131a" stroke="#f0953a" stroke-width="3"/>
    <text x="297" y="76">You approve the plan</text>
    <line x1="480" y1="96" x2="480" y2="150" stroke="#f0953a" stroke-width="1.5" stroke-dasharray="4 5"/>
    <circle cx="480" cy="96" r="8" fill="#15131a" stroke="#f0953a" stroke-width="3"/>
    <text x="480" y="76">Off-plan? It stops and asks</text>
    <line x1="756" y1="96" x2="756" y2="150" stroke="#f0953a" stroke-width="1.5" stroke-dasharray="4 5"/>
    <circle cx="756" cy="96" r="8" fill="#15131a" stroke="#f0953a" stroke-width="3"/>
    <text x="756" y="76">You rule on deviations</text>
    <line x1="1062" y1="96" x2="1062" y2="150" stroke="#f0953a" stroke-width="1.5" stroke-dasharray="4 5"/>
    <circle cx="1062" cy="96" r="8" fill="#15131a" stroke="#f0953a" stroke-width="3"/>
    <text x="1062" y="76">You pick what to fix</text>
  </g>

  <!-- stage cards -->
  <g font-size="14">
    <g transform="translate(24 150)">
      <rect width="240" height="200" rx="14" fill="#211e28" stroke="#35313f"/>
      <text x="20" y="34" fill="#f0953a" font-size="12" font-weight="700" letter-spacing="1.5">1 · PLAN</text>
      <text x="20" y="60" fill="#f3f1f6" font-size="17" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">spike-design</text>
      <g fill="#b9b5c4"><text x="34" y="98">Goals &amp; non-goals</text><text x="34" y="124">Structure skeleton</text><text x="34" y="150">Key flows</text><text x="34" y="176">Budget: 0 new deps</text></g>
      <g fill="#f0953a"><circle cx="24" cy="93" r="3"/><circle cx="24" cy="119" r="3"/><circle cx="24" cy="145" r="3"/><circle cx="24" cy="171" r="3"/></g>
    </g>
    <g transform="translate(330 150)">
      <rect width="240" height="200" rx="14" fill="#211e28" stroke="#35313f"/>
      <text x="20" y="34" fill="#f0953a" font-size="12" font-weight="700" letter-spacing="1.5">2 · BUILD</text>
      <text x="20" y="60" fill="#f3f1f6" font-size="17" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">slice by slice</text>
      <g fill="#b9b5c4"><text x="34" y="98">~300 lines per slice</text><text x="34" y="124">Decision S1-2 → file:line</text><text x="34" y="150">No surprise abstractions</text><text x="34" y="176">Drifted? Fix plan, redo</text></g>
      <g fill="#f0953a"><circle cx="24" cy="93" r="3"/><circle cx="24" cy="119" r="3"/><circle cx="24" cy="145" r="3"/><circle cx="24" cy="171" r="3"/></g>
    </g>
    <g transform="translate(636 150)">
      <rect width="240" height="200" rx="14" fill="#211e28" stroke="#35313f"/>
      <text x="20" y="34" fill="#f0953a" font-size="12" font-weight="700" letter-spacing="1.5">3 · WALK</text>
      <text x="20" y="60" fill="#f3f1f6" font-size="17" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">risk-walkthrough</text>
      <g fill="#b9b5c4"><text x="34" y="98">3–5 hard points</text><text x="34" y="124">Source-of-truth check</text><text x="34" y="150">Skeleton drift</text><text x="34" y="176">Out-of-budget deps</text></g>
      <g fill="#f0953a"><circle cx="24" cy="93" r="3"/><circle cx="24" cy="119" r="3"/><circle cx="24" cy="145" r="3"/><circle cx="24" cy="171" r="3"/></g>
    </g>
    <g transform="translate(942 150)">
      <rect width="240" height="200" rx="14" fill="#211e28" stroke="#35313f"/>
      <text x="20" y="34" fill="#f0953a" font-size="12" font-weight="700" letter-spacing="1.5">4 · REVIEW</text>
      <text x="20" y="60" fill="#f3f1f6" font-size="17" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">quality-review</text>
      <g fill="#b9b5c4"><text x="34" y="98">Plan vs code first</text><text x="34" y="124">Over-design hunt</text><text x="34" y="150">Severity + file:line</text><text x="34" y="176">Reports, never edits</text></g>
      <g fill="#f0953a"><circle cx="24" cy="93" r="3"/><circle cx="24" cy="119" r="3"/><circle cx="24" cy="145" r="3"/><circle cx="24" cy="171" r="3"/></g>
    </g>
  </g>
  <g stroke="#5d5868" stroke-width="2" marker-end="url(#arrow)">
    <line x1="268" y1="250" x2="324" y2="250"/>
    <line x1="574" y1="250" x2="630" y2="250"/>
    <line x1="880" y1="250" x2="936" y2="250"/>
  </g>
  <text x="600" y="382" fill="#6f6a7b" font-size="13" text-anchor="middle">The agent does the running. Every turn it takes hangs from a decision you made.</text>
</svg>
